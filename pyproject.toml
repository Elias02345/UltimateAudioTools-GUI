[project]
name = "separator-engine"
version = "0.1.8"
description = "Local structured engine for Separator desktop"
requires-python = ">=3.12,<3.13"
dependencies = ["audio-separator==0.47.0", "pydantic>=2.10,<3", "platformdirs>=4,<5", "imageio-ffmpeg==0.6.0", "soundfile>=0.13,<1", "filelock>=4,<5", "audioread==3.0.1", "psutil>=7,<8"]

[project.optional-dependencies]
cpu = ["onnxruntime>=1.23,<2"]
cuda = ["onnxruntime-gpu>=1.23,<2"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["engine/tests"]
pythonpath = ["engine"]
markers = ["integration: genuine ML inference requiring downloaded weights", "cuda: requires NVIDIA CUDA"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine/separator_engine"]
