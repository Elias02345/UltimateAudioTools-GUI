name: Desktop packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['feature/desktop-runtime']
concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
            bundles: deb,appimage
          - os: windows-2022
            target: windows
            bundles: nsis
          - os: macos-15
            target: macos
            bundles: dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '3'
      APPIMAGE_EXTRACT_AND_RUN: '1'
      NO_STRIP: '1'
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Linux desktop dependencies
        timeout-minutes: 8
        if: runner.os == 'Linux'
        run: sudo timeout 120 apt-get -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update && sudo timeout 180 apt-get -o DPkg::Lock::Timeout=60 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf libfuse2 gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      - run: npm ci
      - name: Build verified private runtime
        run: python scripts/build_runtime.py --target ${{ matrix.target }}
      - name: Build installable application
        run: npm run package -- --bundles ${{ matrix.bundles }} --ci
      - name: Checksums and packaged resource audit
        run: python scripts/check_packages.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: separator-${{ matrix.target }}-${{ github.sha }}
          compression-level: 0
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/release/bundle/**/*.sig
            apps/desktop/src-tauri/target/release/bundle/**/*.tar.gz
            apps/desktop/src-tauri/target/release/bundle/SHA256SUMS
            apps/desktop/src-tauri/resources/runtime/manifest.json
          if-no-files-found: error
