name: Desktop packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['feature/desktop-runtime']
concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validation:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/ci.yml
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
            bundles: deb,appimage
          - os: windows-2022
            target: windows
            bundles: nsis
          - os: macos-15
            target: macos
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '3'
      APPIMAGE_EXTRACT_AND_RUN: '1'
      NO_STRIP: '1'
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          cache-on-failure: true
      - name: Linux desktop dependencies
        timeout-minutes: 38
        if: runner.os == 'Linux'
        run: bash scripts/install_linux_ci_dependencies.sh libfuse2 libtbb12 gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav gstreamer1.0-pulseaudio pulseaudio webkit2gtk-driver xvfb dbus-x11
      - run: npm ci
      - name: Require signed application updates
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'TAURI_SIGNING_PRIVATE_KEY is required'; exit 1; }
      - name: Windows codec compiler
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: make tar xz mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-pkgconf
      - name: Verified codec sources
        run: python scripts/fetch_ffmpeg_sources.py
      - uses: actions/cache@v4
        id: ffmpeg-cache
        with:
          path: runtime/build/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('runtime/ffmpeg-sources.json', 'scripts/build_ffmpeg.sh') }}
      - name: Build FFmpeg from corresponding sources
        if: runner.os != 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash scripts/build_ffmpeg.sh
      - name: Build Windows FFmpeg from corresponding sources
        if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash scripts/build_ffmpeg.sh
      - name: Build verified private runtime
        run: python scripts/build_runtime.py --target ${{ matrix.target }}
      - name: Preserve desktop dependency licenses
        run: python scripts/build_dependency_notices.py
      - name: Build installable application
        run: npm run package -- --bundles ${{ matrix.bundles }} --ci --verbose
      - name: Checksums and packaged resource audit
        run: python scripts/check_packages.py --target ${{ matrix.target }}
      - name: Native production window driver
        if: runner.os == 'Linux'
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Native production window smoke
        if: runner.os == 'Linux'
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=separator_smoke
          pactl set-default-sink separator_smoke
          export PULSE_SERVER="$(pactl info | sed -n 's/^Server String: //p')"
          test -n "$PULSE_SERVER"
          xvfb-run -a dbus-run-session -- python scripts/smoke_packaged_window.py --application apps/desktop/src-tauri/target/release/bundle/appimage/Separator_0.1.0_amd64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: separator-${{ matrix.target }}-${{ github.sha }}
          compression-level: 0
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb.sig
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            apps/desktop/src-tauri/target/release/bundle/SHA256SUMS
            apps/desktop/src-tauri/resources/runtime/manifest.json
            runtime/build/FFmpeg-corresponding-source-*.tar.gz
            .test-output/package-window.*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [package, validation]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          pattern: separator-*
          path: release-input
      - name: Build signature verifier
        run: cargo build --release --locked --manifest-path scripts/artifact-verifier/Cargo.toml
      - name: Verify and prepare release
        run: python scripts/prepare_release.py --input release-input --output release-assets --version '${{ github.ref_name }}' --verifier scripts/artifact-verifier/target/release/separator-artifact-verifier
      - name: Publish verified release and update feed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create '${{ github.ref_name }}' release-assets/* --verify-tag --title "Separator ${{ github.ref_name }}" --notes-file docs/RELEASE_NOTES.md
