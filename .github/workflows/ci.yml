name: Checks
on:
  push:
    branches: [dev, main, 'feature/**', 'fix/**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: git diff --exit-code packages/shared
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: CPU PyTorch
        if: runner.os != 'macOS'
        run: uv pip install --system torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Apple PyTorch
        if: runner.os == 'macOS'
        run: uv pip install --system torch==2.14.1 torchvision==0.29.1
      - run: uv pip install --system -c runtime/constraints.txt ".[cpu,dev]"
      - run: ruff check engine scripts
      - run: python -m pytest -q
      - name: Generate contract
        run: python scripts/generate_schema.py
        env:
          PYTHONPATH: engine
      - run: git diff --exit-code packages/shared/schema.json
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Linux build dependencies
        timeout-minutes: 8
        run: |
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update; then break; fi
            sleep 5
          done
          sudo timeout 180 apt-get -o DPkg::Lock::Timeout=60 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
